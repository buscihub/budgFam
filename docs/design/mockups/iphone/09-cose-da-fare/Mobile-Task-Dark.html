<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cose da fare — Mobile (Liquid Glass) (scuro)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; }
  .lg-btn { font-family: inherit; cursor: pointer; }
  .lg-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    position: relative;
  }
  .lg-card::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 16px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }
  .lg-navbar {
    background: rgba(23,17,14,0.65);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .lg-btn-primary {
    background: linear-gradient(155deg, #E58F5E 0%, #C1673A 100%);
    box-shadow: 0 6px 16px rgba(193,103,58,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    border: none;
  }
  .lg-segment { background: rgba(255,255,255,0.08); border-radius: 14px; padding: 4px; }
  .lg-segment-active { background: rgba(255,255,255,0.18); box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  .lg-tabbar {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 14px 34px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .lg-tab-active { background: rgba(224,138,92,0.22); border: 1px solid rgba(224,138,92,0.32); }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(165deg, #1D1512 0%, #241A15 55%, #170F0C 100%); color: #F3E9DE; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Navbar -->
  <div class="lg-navbar" style="padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">Cose da fare</div>
    <a href="Mobile-Aggiungi-Task.html" aria-label="Nuova attività" class="lg-btn lg-btn-primary" style="width: 36px; height: 36px; border-radius: 999px; color: #1D1512; display: flex; align-items: center; justify-content: center; text-decoration: none;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
  </div>

  <!-- Tabs -->
  <div style="padding: 12px 20px 0; flex-shrink: 0;">
    <div class="lg-segment" style="display: flex; gap: 4px;">
      <button class="lg-btn lg-segment-active" style="flex: 1; padding: 9px 0; border-radius: 11px; border: none; color: #F3E9DE; font-weight: 700; font-size: 13px;">Da fare (4)</button>
      <button class="lg-btn" style="flex: 1; padding: 9px 0; border-radius: 11px; border: none; background: none; color: #B4A395; font-weight: 600; font-size: 13px;">Fatte</button>
    </div>
  </div>

  <!-- List -->
  <div style="flex-grow: 1; margin-top: 12px; padding: 0 18px; overflow: hidden; min-height: 0;">
    <div class="lg-card" style="border-radius: 24px; padding: 4px 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column;">

      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.10);">
        <button aria-label="Segna come fatta: Pagare bolletta luce" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; border-radius: 999px; border: 2px solid #E2925F; background: none;"></button>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Pagare bolletta luce</div>
          <div style="font-size: 12px; color: #FF9B7A; font-weight: 700; margin-top: 2px;">Scade oggi</div>
        </div>
        <div style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #B4A395; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">F</div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.10);">
        <button aria-label="Segna come fatta: Fare la spesa settimanale" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; border-radius: 999px; border: 2px solid #E2925F; background: none;"></button>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Fare la spesa settimanale</div>
          <div style="font-size: 12px; color: #B4A395; margin-top: 2px;">Scade domani</div>
        </div>
        <div style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #B4A395; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">M</div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.10);">
        <button aria-label="Segna come fatta: Portare il bucato in lavanderia" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; border-radius: 999px; border: 2px solid #E2925F; background: none;"></button>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Portare il bucato in lavanderia</div>
          <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #B4A395; margin-top: 2px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B4A395" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a4 4 0 014-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a4 4 0 01-4 4H3"></path></svg>
            Ogni lunedì
          </div>
        </div>
        <div style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #B4A395; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">M</div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0;">
        <div aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; border-radius: 999px; background: linear-gradient(155deg, #E58F5E 0%, #C1673A 100%); display: flex; align-items: center; justify-content: center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px; color: #7E7061; text-decoration: line-through;">Prenotare l'idraulico</div>
          <div style="font-size: 12px; color: #7E7061; margin-top: 2px;">Fatto ieri</div>
        </div>
        <div style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #B4A395; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">F</div>
      </div>
    </div>
  </div>

  <!-- Floating tab bar -->
  <div style="flex-shrink: 0; padding: 12px 16px 20px;">
    <div class="lg-tabbar" style="border-radius: 30px; display: flex; padding: 6px;">
      <button class="lg-btn" style="flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4A395" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="2"></rect><rect x="10" y="7" width="4" height="13" rx="2"></rect><rect x="16" y="3" width="4" height="17" rx="2"></rect></svg>
        <span style="color: #B4A395; font-weight: 600; font-size: 11px;">Riepilogo</span>
      </button>
      <button class="lg-btn" style="flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4A395" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
        <span style="color: #B4A395; font-weight: 600; font-size: 11px;">Movimenti</span>
      </button>
      <div class="lg-tab-active" style="flex: 1; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E2925F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M8 12l3 3 5-6"></path></svg>
        <span style="color: #E2925F; font-weight: 700; font-size: 11px;">Cose da fare</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
