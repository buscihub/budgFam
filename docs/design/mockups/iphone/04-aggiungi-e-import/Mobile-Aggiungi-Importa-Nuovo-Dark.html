<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(165deg, #1D1512 0%, #241A15 55%, #170F0C 100%); color: #F3E9DE; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; overflow: hidden; position: relative;">

 style="font-size:12px;font-weight:600;color:#B4A395;margin-bottom:8px;">Tipo</div><div class="lg-segment" role="group" style="display:flex;gap:4px;"><button class="lg-btn lg-segment-active" aria-pressed="true" style="flex:1;padding:9px 0;border-radius:11px;border:none;color:#F3E9DE;font-weight:700;font-size:13px;">Conto</button><button class="lg-btn" aria-pressed="false" style="flex:1;padding:9px 0;border-radius:11px;border:none;background:none;color:#B4A395;font-weight:600;font-size:13px;">Carta</button><button class="lg-btn" aria-pressed="false" style="flex:1;padding:9px 0;border-radius:11px;border:none;background:none;color:#B4A395;font-weight:600;font-size:13px;">Contanti</button></div></div><div><div style="font-size:12px;font-weight:600;color:#B4A395;margin-bottom:8px;">Chi lo vede</div><div role="radiogroup" aria-label="Chi vede il conto" style="display:flex;flex-direction:column;gap:8px;"><button role="radio" aria-checked="true" class="lg-btn lg-opt-sel" style="width:100%;text-align:left;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;color:#F3E9DE;"><span style="margin-top:1px;display:flex;flex-shrink:0;"><span aria-hidden="true" style="width:20px;height:20px;flex-shrink:0;border-radius:999px;background:linear-gradient(155deg, #E58F5E 0%, #C1673A 100%);display:flex;align-items:center;justify-content:center;"><span style="width:8px;height:8px;border-radius:999px;background:#1D1512;"></span></span></span><span style="display:block;"><span style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>Privato</span><span style="display:block;font-size:12px;line-height:1.4;color:#B4A395;margin-top:3px;">Lo vedi solo tu, con i suoi movimenti.</span></span></button><button role="radio" aria-checked="false" class="lg-btn lg-field" style="width:100%;text-align:left;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;color:#F3E9DE;"><span style="margin-top:1px;display:flex;flex-shrink:0;"><span aria-hidden="true" style="display:block;width:20px;height:20px;flex-shrink:0;box-sizing:border-box;border-radius:999px;border:1.5px solid #B4A395;"></span></span><span style="display:block;"><span style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c.5-3 2.7-5 5.5-5s5 2 5.5 5"></path><circle cx="17" cy="9" r="2.3"></circle><path d="M16 14c2.6.2 4.2 2 4.6 4.5"></path></svg>Condiviso</span><span style="display:block;font-size:12px;line-height:1.4;color:#B4A395;margin-top:3px;">La famiglia vede conto e movimenti, anche se lo usi solo tu.</span></span></button></div><div style="font-size:11px;line-height:1.4;color:#B4A395;margin-top:8px;">Ogni movimento può comunque avere una visibilità sua.</div></div><div><div style="font-size:12px;font-weight:600;color:#B4A395;margin-bottom:8px;">Formato del file</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="lg-btn lg-pill-active" aria-pressed="true" style="padding:8px 14px;border-radius:999px;border:none;color:#1D1512;font-weight:700;font-size:12px;">Revolut</button><button class="lg-btn lg-glassbtn" aria-pressed="false" style="padding:8px 14px;border-radius:999px;color:#B4A395;font-weight:700;font-size:12px;">Trade Republic</button><button class="lg-btn lg-glassbtn" aria-pressed="false" style="padding:8px 14px;border-radius:999px;color:#B4A395;font-weight:700;font-size:12px;">Lo scelgo all’import</button></div><div style="display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.4;color:#B4A395;margin-top:8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B4A395" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg><span>Altre banche in arrivo: poi riconosceremo il formato da soli.</span></div></div></div><div style="flex-shrink:0;padding:14px 20px 20px;"><a href="Mobile-Aggiungi-Importa.html" class="lg-btn lg-btn-primary" style="display:block;width:100%;box-sizing:border-box;padding:15px 0;border-radius:18px;color:#1D1512;font-weight:700;font-size:15px;text-align:center;text-decoration:none;">Crea e usa per l’import</a></div></div>
