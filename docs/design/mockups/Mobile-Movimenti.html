<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Movimenti — Mobile (Liquid Glass)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; }
  .lg-btn { font-family: inherit; cursor: pointer; }
  .lg-input { font-family: inherit; }
  .lg-input::placeholder { color: #9C8B7C; }
  .lg-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow: 0 10px 26px rgba(58,46,39,0.10);
    position: relative;
  }
  .lg-card::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 16px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
  }
  .lg-navbar {
    background: rgba(251,247,241,0.68);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-bottom: 1px solid rgba(58,46,39,0.06);
  }
  .lg-glassbtn {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 10px rgba(58,46,39,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .lg-btn-primary {
    background: linear-gradient(155deg, #D3835A 0%, #B85A30 100%);
    box-shadow: 0 6px 16px rgba(184,90,48,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    border: none;
  }
  .lg-tabbar {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 14px 34px rgba(58,46,39,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .lg-tab-active { background: rgba(193,103,58,0.16); border: 1px solid rgba(193,103,58,0.22); }
  .lg-banner {
    background: rgba(230,150,90,0.24);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(230,150,90,0.35);
  }
</style>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#EFDBC1; padding:24px; box-sizing:border-box;">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(165deg, #FCF6EC 0%, #F6E8D6 55%, #EFDBC1 100%); color: #3A2E27; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Navbar -->
  <div class="lg-navbar" style="padding: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 2;">
    <button aria-label="Mese precedente" class="lg-btn lg-glassbtn" style="width: 36px; height: 36px; border-radius: 999px; color: #3A2E27; font-size: 17px; display: flex; align-items: center; justify-content: center;">‹</button>
    <div style="font-weight: 700; font-size: 17px; letter-spacing: -0.01em;">Settembre 2026</div>
    <button aria-label="Mese successivo" class="lg-btn lg-glassbtn" style="width: 36px; height: 36px; border-radius: 999px; color: #3A2E27; font-size: 17px; display: flex; align-items: center; justify-content: center;">›</button>
  </div>

  <!-- Search + filter + add -->
  <div style="padding: 12px 18px 0; display: flex; gap: 8px; flex-shrink: 0; z-index: 2;">
    <div class="lg-glassbtn" style="flex: 1; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 14px; min-width: 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input class="lg-input" type="text" aria-label="Cerca movimento" placeholder="Cerca movimento" style="border: none; outline: none; background: transparent; font-size: 13px; color: #3A2E27; width: 100%;">
    </div>
    <button aria-label="Filtra" class="lg-btn lg-glassbtn" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3A2E27" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2" fill="#3A2E27" stroke="none"></circle><line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2" fill="#3A2E27" stroke="none"></circle><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="7" cy="18" r="2" fill="#3A2E27" stroke="none"></circle></svg>
    </button>
    <button aria-label="Aggiungi movimento" class="lg-btn lg-btn-primary" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>

  <!-- List -->
  <div style="flex-grow: 1; margin-top: 12px; padding: 0 18px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; z-index: 1;">

    <a href="Mobile-Aggiungi.html" style="text-decoration: none; color: inherit; display: block; margin-bottom: 10px;">
      <div class="lg-banner" style="border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9E3B1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><line x1="12" y1="9" x2="12" y2="13"></line><circle cx="12" cy="16.5" r="0.6" fill="#9E3B1E" stroke="none"></circle></svg>
          <div style="font-weight: 700; font-size: 13px; color: #8A3A1E;">3 movimenti da rivedere</div>
        </div>
        <span style="color: #8A3A1E; font-weight: 800; font-size: 13px; flex-shrink: 0;">Rivedi</span>
      </div>
    </a>

    <div class="lg-card" style="border-radius: 24px; padding: 4px 16px; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;">

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <div style="width: 34px; flex-shrink: 0; text-align: center; font-size: 11px; font-weight: 700; color: #7A6A5C; line-height: 1.15;">24<br>set</div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Conad Palermo</div>
          <span style="display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(58,46,39,0.06); color: #7A6A5C;">Spesa</span>
        </div>
        <div style="flex-shrink: 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;">-42,30&nbsp;€</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <div style="width: 34px; flex-shrink: 0; text-align: center; font-size: 11px; font-weight: 700; color: #7A6A5C; line-height: 1.15;">23<br>set</div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Bolletta Enel</div>
          <span style="display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(58,46,39,0.06); color: #7A6A5C;">Bollette</span>
        </div>
        <div style="flex-shrink: 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;">-68,00&nbsp;€</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <div style="width: 34px; flex-shrink: 0; text-align: center; font-size: 11px; font-weight: 700; color: #7A6A5C; line-height: 1.15;">22<br>set</div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Stipendio</div>
          <span style="display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(193,103,58,0.16); color: #B85A30;">Entrata</span>
        </div>
        <div style="flex-shrink: 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; color: #B85A30;">+1.450,00&nbsp;€</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <div style="width: 34px; flex-shrink: 0; text-align: center; font-size: 11px; font-weight: 700; color: #7A6A5C; line-height: 1.15;">21<br>set</div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Bar Centrale</div>
          <span style="display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; background: rgba(230,150,90,0.28); color: #8A3A1E;">Da rivedere</span>
        </div>
        <div style="flex-shrink: 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;">-3,50&nbsp;€</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <div style="width: 34px; flex-shrink: 0; text-align: center; font-size: 11px; font-weight: 700; color: #7A6A5C; line-height: 1.15;">20<br>set</div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>
            Farmacia Nord
          </div>
          <span style="display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(58,46,39,0.06); color: #7A6A5C;">Salute · privato</span>
        </div>
        <div style="flex-shrink: 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;">-15,90&nbsp;€</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0;">
        <div style="width: 34px; flex-shrink: 0; text-align: center; font-size: 11px; font-weight: 700; color: #7A6A5C; line-height: 1.15;">19<br>set</div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 14px;">Trenitalia</div>
          <span style="display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(58,46,39,0.06); color: #7A6A5C;">Trasporti</span>
        </div>
        <div style="flex-shrink: 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;">-24,00&nbsp;€</div>
      </div>
    </div>
  </div>

  <!-- Floating tab bar -->
  <div style="flex-shrink: 0; padding: 12px 16px 20px; z-index: 2;">
    <div class="lg-tabbar" style="border-radius: 30px; display: flex; padding: 6px;">
      <button class="lg-btn" style="flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="2"></rect><rect x="10" y="7" width="4" height="13" rx="2"></rect><rect x="16" y="3" width="4" height="17" rx="2"></rect></svg>
        <span style="color: #7A6A5C; font-weight: 600; font-size: 11px;">Riepilogo</span>
      </button>
      <div class="lg-tab-active" style="flex: 1; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B85A30" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
        <span style="color: #B85A30; font-weight: 700; font-size: 11px;">Movimenti</span>
      </div>
      <button class="lg-btn" style="flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M8 12l3 3 5-6"></path></svg>
        <span style="color: #7A6A5C; font-weight: 600; font-size: 11px;">Cose da fare</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
