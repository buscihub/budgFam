<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Riepilogo — Stile A minimale</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  body { margin: 0; }
  .bf-btn { font-family: inherit; cursor: pointer; }
  .bf-navbtn:hover { color: #1F6F63; }
</style>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#EFDBC1; padding:24px; box-sizing:border-box;">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #16181D; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header -->
  <div style="padding: 20px 20px 4px; display: flex; align-items: center; justify-content: space-between;">
    <button aria-label="Mese precedente" class="bf-btn" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #16181D; font-size: 18px; display: flex; align-items: center; justify-content: center;">‹</button>
    <div style="font-weight: 700; font-size: 16px;">Settembre 2026</div>
    <button aria-label="Mese successivo" class="bf-btn" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #16181D; font-size: 18px; display: flex; align-items: center; justify-content: center;">›</button>
  </div>

  <!-- Content -->
  <div style="flex-grow: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 18px; min-height: 0;">

    <!-- Saldo -->
    <div style="text-align: center; padding: 8px 0 0;">
      <div style="font-size: 12px; color: #6B7280; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;">Saldo di settembre</div>
      <div style="font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 4px;">+1.240&nbsp;€</div>
    </div>

    <!-- Entrate / Uscite -->
    <div style="display: flex; gap: 12px;">
      <div style="flex: 1; border: 1px solid #E5E7EB; border-radius: 12px; padding: 14px 16px;">
        <div style="font-size: 12px; color: #6B7280; font-weight: 600;">Entrate</div>
        <div style="font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums;">3.200&nbsp;€</div>
      </div>
      <div style="flex: 1; border: 1px solid #E5E7EB; border-radius: 12px; padding: 14px 16px;">
        <div style="font-size: 12px; color: #6B7280; font-weight: 600;">Uscite</div>
        <div style="font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums;">1.960&nbsp;€</div>
      </div>
    </div>

    <!-- Budget per categoria -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="font-size: 14px; font-weight: 700;">Budget per categoria</div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 600;">Spesa</span>
          <span style="color: #6B7280; font-variant-numeric: tabular-nums;">420&nbsp;€ / 500&nbsp;€</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: #E5E7EB; overflow: hidden;">
          <div style="width: 84%; height: 100%; background: #1F6F63;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 600;">Bollette</span>
          <span style="color: #6B7280; font-variant-numeric: tabular-nums;">180&nbsp;€ / 200&nbsp;€</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: #E5E7EB; overflow: hidden;">
          <div style="width: 90%; height: 100%; background: #1F6F63;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 600;">Trasporti</span>
          <span style="color: #6B7280; font-variant-numeric: tabular-nums;">90&nbsp;€ / 150&nbsp;€</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: #E5E7EB; overflow: hidden;">
          <div style="width: 60%; height: 100%; background: #1F6F63;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 600;">Svago</span>
          <span style="color: #B5541D; font-weight: 700; font-variant-numeric: tabular-nums;">140&nbsp;€ / 100&nbsp;€</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: #E5E7EB; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: #B5541D;"></div>
        </div>
        <div style="font-size: 11px; color: #B5541D; font-weight: 600;">+40&nbsp;€ oltre budget</div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div style="display: flex; border-top: 1px solid #E5E7EB; flex-shrink: 0;">
    <button class="bf-btn" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 8px; background: none; border: none; color: #1F6F63; font-weight: 700; font-size: 11px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="1"></rect><rect x="10" y="7" width="4" height="13" rx="1"></rect><rect x="16" y="3" width="4" height="17" rx="1"></rect></svg>
      Riepilogo
    </button>
    <button class="bf-btn bf-navbtn" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 8px; background: none; border: none; color: #6B7280; font-weight: 600; font-size: 11px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
      Movimenti
    </button>
    <button class="bf-btn bf-navbtn" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 8px; background: none; border: none; color: #6B7280; font-weight: 600; font-size: 11px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
      Importa
    </button>
    <button class="bf-btn bf-navbtn" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 8px; background: none; border: none; color: #6B7280; font-weight: 600; font-size: 11px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>
      Cose da fare
    </button>
  </div>
</div>
</body>
</html>
