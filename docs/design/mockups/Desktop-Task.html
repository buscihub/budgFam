<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cose da fare — Desktop (Liquid Glass)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; }
  .lg-btn { font-family: inherit; cursor: pointer; }
  .lg-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow: 0 10px 26px rgba(58,46,39,0.10);
    position: relative;
  }
  .lg-card::before {
    content: '';
    position: absolute;
    top: 0; left: 18px; right: 18px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
  }
  .lg-sidebar {
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-right: 1px solid rgba(255,255,255,0.7);
  }
  .lg-navitem:hover { background: rgba(58,46,39,0.05); }
  .lg-navitem-active { background: rgba(193,103,58,0.16); border: 1px solid rgba(193,103,58,0.2); }
  .lg-btn-primary {
    background: linear-gradient(155deg, #D3835A 0%, #B85A30 100%);
    box-shadow: 0 8px 20px rgba(184,90,48,0.32), inset 0 1px 0 rgba(255,255,255,0.5);
    border: none;
  }
  .lg-segment { background: rgba(58,46,39,0.06); border-radius: 999px; padding: 4px; }
  .lg-segment-active { background: rgba(255,255,255,0.92); box-shadow: 0 2px 6px rgba(58,46,39,0.14); }
</style>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#EFDBC1; padding:24px; box-sizing:border-box;">
<div style="width: 1280px; height: 832px; box-sizing: border-box; background: linear-gradient(160deg, #FCF6EC 0%, #F6E8D6 55%, #EFDBC1 100%); color: #3A2E27; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; overflow: hidden;">

  <!-- Sidebar -->
  <div class="lg-sidebar" style="width: 240px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 24px 16px;">
    <div style="font-weight: 700; font-size: 18px; padding: 0 8px; margin-bottom: 28px; letter-spacing: -0.01em;">budgFam</div>

    <button class="lg-btn lg-navitem" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: none; background: none; color: #3A2E27; font-weight: 600; font-size: 14px; margin-bottom: 4px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="2"></rect><rect x="10" y="7" width="4" height="13" rx="2"></rect><rect x="16" y="3" width="4" height="17" rx="2"></rect></svg>
      Riepilogo
    </button>
    <button class="lg-btn lg-navitem" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: none; background: none; color: #3A2E27; font-weight: 600; font-size: 14px; margin-bottom: 4px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
      Movimenti
    </button>
    <div class="lg-navitem-active" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #B85A30;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M8 12l3 3 5-6"></path></svg>
      Cose da fare
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="border-top: 1px solid rgba(58,46,39,0.08); padding-top: 16px; display: flex; align-items: center; gap: 8px;">
      <div style="display: flex;">
        <div style="width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(155deg, #D3835A, #B85A30); color: #FFFFFF; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.9);">F</div>
        <div style="width: 26px; height: 26px; margin-left: -8px; border-radius: 999px; background: #8A7A6D; color: #FFFFFF; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.9);">M</div>
        <div style="width: 26px; height: 26px; margin-left: -8px; border-radius: 999px; background: #D9C6AE; border: 2px solid rgba(255,255,255,0.9);"></div>
        <div style="width: 26px; height: 26px; margin-left: -8px; border-radius: 999px; background: #D9C6AE; border: 2px solid rgba(255,255,255,0.9);"></div>
      </div>
      <div style="font-size: 12px; color: #7A6A5C; font-weight: 600;">4 persone</div>
    </div>
  </div>

  <!-- Main -->
  <div style="flex-grow: 1; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">Cose da fare</div>
      <a href="Desktop-Aggiungi-Task.html" class="lg-btn lg-btn-primary" style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; color: #FFFFFF; font-weight: 700; font-size: 13px; text-decoration: none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Nuova attività
      </a>
    </div>

    <div class="lg-segment" style="display: flex; gap: 4px; width: fit-content;">
      <button class="lg-btn lg-segment-active" style="padding: 8px 18px; border-radius: 999px; border: none; color: #3A2E27; font-weight: 700; font-size: 13px;">Da fare (5)</button>
      <button class="lg-btn" style="padding: 8px 18px; border-radius: 999px; border: none; background: none; color: #7A6A5C; font-weight: 600; font-size: 13px;">Fatte</button>
    </div>

    <div class="lg-card" style="flex-grow: 1; border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; min-height: 0;">

      <div style="padding: 16px 26px 6px; font-size: 11px; font-weight: 800; color: #7A6A5C; text-transform: uppercase; letter-spacing: 0.04em;">Oggi</div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 26px; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <button aria-label="Segna come fatta: Pagare bolletta luce" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; border: 2px solid #B85A30; background: none;"></button>
        <div style="flex-grow: 1;">
          <div style="font-weight: 700; font-size: 14px;">Pagare bolletta luce</div>
        </div>
        <div style="font-size: 12px; color: #9E3B1E; font-weight: 700; width: 90px;">Scade oggi</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: rgba(58,46,39,0.06); color: #7A6A5C; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">F</div>
      </div>

      <div style="padding: 16px 26px 6px; font-size: 11px; font-weight: 800; color: #7A6A5C; text-transform: uppercase; letter-spacing: 0.04em;">Questa settimana</div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 26px; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <button aria-label="Segna come fatta: Fare la spesa settimanale" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; border: 2px solid #B85A30; background: none;"></button>
        <div style="flex-grow: 1;">
          <div style="font-weight: 700; font-size: 14px;">Fare la spesa settimanale</div>
        </div>
        <div style="font-size: 12px; color: #7A6A5C; font-weight: 700; width: 90px;">Domani</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: rgba(58,46,39,0.06); color: #7A6A5C; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">M</div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 26px; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <button aria-label="Segna come fatta: Portare il bucato in lavanderia" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; border: 2px solid #B85A30; background: none;"></button>
        <div style="flex-grow: 1;">
          <div style="font-weight: 700; font-size: 14px;">Portare il bucato in lavanderia</div>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #7A6A5C; font-weight: 700; width: 110px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a4 4 0 014-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a4 4 0 01-4 4H3"></path></svg>
          Ogni lunedì
        </div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: rgba(58,46,39,0.06); color: #7A6A5C; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">M</div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 26px; border-bottom: 1px solid rgba(58,46,39,0.08);">
        <button aria-label="Segna come fatta: Rinnovare assicurazione auto" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; border: 2px solid #B85A30; background: none;"></button>
        <div style="flex-grow: 1;">
          <div style="font-weight: 700; font-size: 14px;">Rinnovare assicurazione auto</div>
        </div>
        <div style="font-size: 12px; color: #7A6A5C; font-weight: 700; width: 90px;">Ven 2 ott</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: linear-gradient(155deg, #D3835A, #B85A30); color: #FFFFFF; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;">F</div>
      </div>

      <div style="padding: 16px 26px 6px; font-size: 11px; font-weight: 800; color: #7A6A5C; text-transform: uppercase; letter-spacing: 0.04em;">Più avanti</div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 26px;">
        <button aria-label="Segna come fatta: Prenotare visita dentistica" class="lg-btn" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; border: 2px solid rgba(58,46,39,0.2); background: none;"></button>
        <div style="flex-grow: 1;">
          <div style="font-weight: 700; font-size: 14px;">Prenotare visita dentistica</div>
        </div>
        <div style="font-size: 12px; color: #7A6A5C; font-weight: 700; width: 90px;">15 ott</div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: rgba(58,46,39,0.05); border: 1px dashed rgba(58,46,39,0.2);"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
