<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Aggiungi attività — Mobile (Liquid Glass)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; }
  .lg-btn { font-family: inherit; cursor: pointer; }
  .lg-input { font-family: inherit; }
  .lg-input::placeholder { color: #9C8B7C; }
  .lg-field {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.8);
  }
  .lg-glassbtn {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 10px rgba(58,46,39,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .lg-pill-active {
    background: linear-gradient(155deg, #D3835A 0%, #B85A30 100%);
    box-shadow: 0 4px 12px rgba(184,90,48,0.3), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .lg-segment { background: rgba(58,46,39,0.06); border-radius: 14px; padding: 4px; }
  .lg-segment-active { background: rgba(255,255,255,0.9); box-shadow: 0 2px 6px rgba(58,46,39,0.14); }
  .lg-btn-primary {
    background: linear-gradient(155deg, #D3835A 0%, #B85A30 100%);
    box-shadow: 0 8px 20px rgba(184,90,48,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    border: none;
  }
</style>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#EFDBC1; padding:24px; box-sizing:border-box;">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(165deg, #FCF6EC 0%, #F6E8D6 55%, #EFDBC1 100%); color: #3A2E27; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Grabber -->
  <div style="display: flex; justify-content: center; padding: 10px 0 2px; flex-shrink: 0;">
    <div style="width: 36px; height: 5px; border-radius: 999px; background: rgba(58,46,39,0.18);"></div>
  </div>

  <!-- Header -->
  <div style="padding: 10px 16px 4px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <a href="Mobile-Task.html" aria-label="Chiudi" class="lg-btn lg-glassbtn" style="width: 34px; height: 34px; border-radius: 999px; color: #3A2E27; display: flex; align-items: center; justify-content: center; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </a>
    <div style="font-weight: 700; font-size: 16px;">Nuova attività</div>
    <div style="width: 34px;"></div>
  </div>

  <!-- Form -->
  <div style="flex-grow: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-height: 0;">

    <div>
      <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Titolo</div>
      <input class="lg-input lg-field" type="text" aria-label="Titolo attività" placeholder="Es. Portare il bucato in lavanderia" style="width: 100%; box-sizing: border-box; outline: none; border-radius: 16px; padding: 12px 16px; font-size: 14px; color: #3A2E27;">
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Assegnata a</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="lg-btn lg-pill-active" style="display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 8px; border-radius: 999px; border: none; color: #FFFFFF; font-weight: 700; font-size: 12px;">
          <span style="width: 20px; height: 20px; border-radius: 999px; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 10px;">F</span>
          Federico
        </button>
        <button class="lg-btn lg-glassbtn" style="display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 8px; border-radius: 999px; color: #7A6A5C; font-weight: 700; font-size: 12px;">
          <span style="width: 20px; height: 20px; border-radius: 999px; background: rgba(58,46,39,0.08); display: flex; align-items: center; justify-content: center; font-size: 10px;">M</span>
          Mamma
        </button>
        <button class="lg-btn lg-glassbtn" style="padding: 7px 14px; border-radius: 999px; color: #7A6A5C; font-weight: 700; font-size: 12px;">Chiunque</button>
      </div>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Tipo</div>
      <div class="lg-segment" style="display: flex;">
        <button class="lg-btn lg-segment-active" style="flex: 1; padding: 9px 0; border-radius: 11px; border: none; color: #3A2E27; font-weight: 700; font-size: 13px;">Una tantum</button>
        <button class="lg-btn" style="flex: 1; padding: 9px 0; border-radius: 11px; border: none; background: none; color: #7A6A5C; font-weight: 600; font-size: 13px;">Ricorrente</button>
      </div>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Scadenza</div>
      <button class="lg-btn lg-field" style="width: 100%; box-sizing: border-box; text-align: left; border-radius: 16px; padding: 12px 16px; font-size: 14px; font-weight: 700; color: #3A2E27; display: flex; align-items: center; justify-content: space-between;">
        Domani · 27 set 2026
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4"></path><path d="M16 3v4"></path><path d="M3 10h18"></path></svg>
      </button>
    </div>

    <div style="height: 4px;"></div>
  </div>

  <!-- Save bar -->
  <div style="flex-shrink: 0; padding: 14px 20px 20px;">
    <button class="lg-btn lg-btn-primary" style="width: 100%; box-sizing: border-box; padding: 15px 0; border-radius: 18px; color: #FFFFFF; font-weight: 700; font-size: 15px;">Salva attività</button>
  </div>
</div>
</body>
</html>
