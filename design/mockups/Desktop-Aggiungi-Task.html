<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Aggiungi attività — Desktop (Liquid Glass)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; }
  .lg-btn { font-family: inherit; cursor: pointer; }
  .lg-input { font-family: inherit; }
  .lg-input::placeholder { color: #9C8B7C; }
  .lg-sidebar {
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-right: 1px solid rgba(255,255,255,0.7);
  }
  .lg-navitem-active { background: rgba(193,103,58,0.16); border: 1px solid rgba(193,103,58,0.2); }
  .lg-field {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.85);
  }
  .lg-glassbtn {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 4px 10px rgba(58,46,39,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .lg-pill-active {
    background: linear-gradient(155deg, #D3835A 0%, #B85A30 100%);
    box-shadow: 0 4px 12px rgba(184,90,48,0.3), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .lg-segment { background: rgba(58,46,39,0.06); border-radius: 14px; padding: 4px; }
  .lg-segment-active { background: rgba(255,255,255,0.92); box-shadow: 0 2px 6px rgba(58,46,39,0.14); }
  .lg-btn-primary {
    background: linear-gradient(155deg, #D3835A 0%, #B85A30 100%);
    box-shadow: 0 8px 20px rgba(184,90,48,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    border: none;
  }
  .lg-modal {
    background: rgba(255,255,255,0.62);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 30px 70px rgba(58,46,39,0.32), inset 0 1px 0 rgba(255,255,255,0.9);
    position: relative;
  }
  .lg-modal::before {
    content: '';
    position: absolute;
    top: 0; left: 30px; right: 30px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
  }
</style>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#EFDBC1; padding:24px; box-sizing:border-box;">
<div style="width: 1280px; height: 832px; box-sizing: border-box; background: linear-gradient(160deg, #FCF6EC 0%, #F6E8D6 55%, #EFDBC1 100%); color: #3A2E27; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; overflow: hidden; position: relative;">

  <!-- Sidebar (behind scrim) -->
  <div class="lg-sidebar" style="width: 240px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 24px 16px;">
    <div style="font-weight: 700; font-size: 18px; padding: 0 8px; margin-bottom: 28px; letter-spacing: -0.01em;">budgFam</div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #3A2E27;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="2"></rect><rect x="10" y="7" width="4" height="13" rx="2"></rect><rect x="16" y="3" width="4" height="17" rx="2"></rect></svg>
      Riepilogo
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #3A2E27;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
      Movimenti
    </div>
    <div class="lg-navitem-active" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #B85A30;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M8 12l3 3 5-6"></path></svg>
      Cose da fare
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="border-top: 1px solid rgba(58,46,39,0.08); padding-top: 16px; display: flex; align-items: center; gap: 8px;">
      <div style="display: flex;">
        <div style="width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(155deg, #D3835A, #B85A30); color: #FFFFFF; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.9);">F</div>
        <div style="width: 26px; height: 26px; margin-left: -8px; border-radius: 999px; background: #8A7A6D; color: #FFFFFF; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.9);">M</div>
        <div style="width: 26px; height: 26px; margin-left: -8px; border-radius: 999px; background: #D9C6AE; border: 2px solid rgba(255,255,255,0.9);"></div>
        <div style="width: 26px; height: 26px; margin-left: -8px; border-radius: 999px; background: #D9C6AE; border: 2px solid rgba(255,255,255,0.9);"></div>
      </div>
      <div style="font-size: 12px; color: #7A6A5C; font-weight: 600;">4 persone</div>
    </div>
  </div>

  <!-- Main (behind scrim, blurred out) -->
  <div style="flex-grow: 1; box-sizing: border-box; padding: 32px 40px; min-width: 0; filter: blur(3px); opacity: 0.5;">
    <div style="font-weight: 700; font-size: 22px;">Cose da fare</div>
  </div>

  <!-- Scrim -->
  <div style="position: absolute; inset: 0; background: rgba(58,46,39,0.22); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);"></div>

  <!-- Modal -->
  <div class="lg-modal" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 520px; background: rgba(255,255,255,0.62); border-radius: 32px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="padding: 24px 30px 4px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="font-weight: 700; font-size: 18px;">Nuova attività</div>
      <a href="Desktop-Task.html" aria-label="Chiudi" class="lg-btn lg-glassbtn" style="width: 34px; height: 34px; border-radius: 999px; color: #3A2E27; display: flex; align-items: center; justify-content: center; text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </a>
    </div>

    <div style="padding: 20px 30px 0; display: flex; flex-direction: column; gap: 18px;">

      <div>
        <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Titolo</div>
        <input class="lg-input lg-field" type="text" aria-label="Titolo attività" placeholder="Es. Portare il bucato in lavanderia" style="width: 100%; box-sizing: border-box; outline: none; border-radius: 16px; padding: 12px 16px; font-size: 14px; color: #3A2E27;">
      </div>

      <div>
        <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Assegnata a</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="lg-btn lg-pill-active" style="display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 8px; border-radius: 999px; border: none; color: #FFFFFF; font-weight: 700; font-size: 12px;">
            <span style="width: 20px; height: 20px; border-radius: 999px; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 10px;">F</span>
            Federico
          </button>
          <button class="lg-btn lg-glassbtn" style="display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 8px; border-radius: 999px; color: #7A6A5C; font-weight: 700; font-size: 12px;">
            <span style="width: 20px; height: 20px; border-radius: 999px; background: rgba(58,46,39,0.08); display: flex; align-items: center; justify-content: center; font-size: 10px;">M</span>
            Mamma
          </button>
          <button class="lg-btn lg-glassbtn" style="padding: 7px 14px; border-radius: 999px; color: #7A6A5C; font-weight: 700; font-size: 12px;">Chiunque</button>
        </div>
      </div>

      <div style="display: flex; gap: 16px;">
        <div style="flex: 1;">
          <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Tipo</div>
          <div class="lg-segment" style="display: flex;">
            <button class="lg-btn lg-segment-active" style="flex: 1; padding: 8px 0; border-radius: 11px; border: none; color: #3A2E27; font-weight: 700; font-size: 13px;">Una tantum</button>
            <button class="lg-btn" style="flex: 1; padding: 8px 0; border-radius: 11px; border: none; background: none; color: #7A6A5C; font-weight: 600; font-size: 13px;">Ricorrente</button>
          </div>
        </div>
        <div style="flex: 1;">
          <div style="font-size: 12px; font-weight: 600; color: #7A6A5C; margin-bottom: 8px;">Scadenza</div>
          <button class="lg-btn lg-field" style="width: 100%; box-sizing: border-box; text-align: left; border-radius: 16px; padding: 11px 16px; font-size: 13px; font-weight: 700; color: #3A2E27; display: flex; align-items: center; justify-content: space-between;">
            27 set
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4"></path><path d="M16 3v4"></path><path d="M3 10h18"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <div style="flex-shrink: 0; padding: 22px 30px 26px; display: flex; justify-content: flex-end; gap: 10px;">
      <a href="Desktop-Task.html" class="lg-btn lg-glassbtn" style="padding: 12px 22px; border-radius: 999px; color: #3A2E27; font-weight: 700; font-size: 14px; text-decoration: none;">Annulla</a>
      <button class="lg-btn lg-btn-primary" style="padding: 12px 26px; border-radius: 999px; color: #FFFFFF; font-weight: 700; font-size: 14px;">Salva attività</button>
    </div>
  </div>
</div>
</body>
</html>
