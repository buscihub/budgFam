<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Riepilogo — Mobile (Liquid Glass)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; }
  .lg-btn { font-family: inherit; cursor: pointer; }
  .lg-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow: 0 10px 26px rgba(58,46,39,0.10);
    position: relative;
  }
  .lg-card::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 16px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
  }
  .lg-navbar {
    background: rgba(251,247,241,0.68);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-bottom: 1px solid rgba(58,46,39,0.06);
  }
  .lg-glassbtn {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 10px rgba(58,46,39,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .lg-tabbar {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 14px 34px rgba(58,46,39,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .lg-tab-active {
    background: rgba(193,103,58,0.16);
    border: 1px solid rgba(193,103,58,0.22);
  }
  .lg-track { background: rgba(58,46,39,0.08); position: relative; overflow: hidden; }
  .lg-fill {
    background: linear-gradient(90deg, #E08A5C, #B85A30);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .lg-fill-over {
    background: linear-gradient(90deg, #C6512F, #9E3B1E);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }
</style>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#EFDBC1; padding:24px; box-sizing:border-box;">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(165deg, #FCF6EC 0%, #F6E8D6 55%, #EFDBC1 100%); color: #3A2E27; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Navbar -->
  <div class="lg-navbar" style="padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 2;">
    <button aria-label="Mese precedente" class="lg-btn lg-glassbtn" style="width: 36px; height: 36px; border-radius: 999px; color: #3A2E27; font-size: 17px; display: flex; align-items: center; justify-content: center;">‹</button>
    <div style="font-weight: 700; font-size: 17px; letter-spacing: -0.01em;">Settembre 2026</div>
    <button aria-label="Mese successivo" class="lg-btn lg-glassbtn" style="width: 36px; height: 36px; border-radius: 999px; color: #3A2E27; font-size: 17px; display: flex; align-items: center; justify-content: center;">›</button>
  </div>

  <!-- Content -->
  <div style="flex-grow: 1; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; z-index: 1;">

    <!-- Saldo -->
    <div class="lg-card" style="border-radius: 30px; padding: 22px 22px; text-align: center;">
      <div style="font-size: 12px; color: #7A6A5C; font-weight: 600; letter-spacing: 0.02em;">Saldo di settembre</div>
      <div style="font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; color: #B85A30; letter-spacing: -0.02em;">+1.240&nbsp;€</div>
    </div>

    <!-- Entrate / Uscite -->
    <div style="display: flex; gap: 12px;">
      <div class="lg-card" style="flex: 1; border-radius: 22px; padding: 14px 16px;">
        <div style="font-size: 12px; color: #7A6A5C; font-weight: 600;">Entrate</div>
        <div style="font-size: 19px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums;">3.200&nbsp;€</div>
      </div>
      <div class="lg-card" style="flex: 1; border-radius: 22px; padding: 14px 16px;">
        <div style="font-size: 12px; color: #7A6A5C; font-weight: 600;">Uscite</div>
        <div style="font-size: 19px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums;">1.960&nbsp;€</div>
      </div>
    </div>

    <!-- Budget per categoria -->
    <div class="lg-card" style="border-radius: 26px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0; overflow: hidden;">
      <div style="font-size: 15px; font-weight: 700;">Budget per categoria</div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 700;">Spesa</span>
          <span style="color: #7A6A5C; font-variant-numeric: tabular-nums;">420&nbsp;€ / 500&nbsp;€</span>
        </div>
        <div class="lg-track" style="height: 7px; border-radius: 999px;">
          <div class="lg-fill" style="width: 84%; height: 100%; border-radius: 999px;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 700;">Bollette</span>
          <span style="color: #7A6A5C; font-variant-numeric: tabular-nums;">180&nbsp;€ / 200&nbsp;€</span>
        </div>
        <div class="lg-track" style="height: 7px; border-radius: 999px;">
          <div class="lg-fill" style="width: 90%; height: 100%; border-radius: 999px;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 700;">Trasporti</span>
          <span style="color: #7A6A5C; font-variant-numeric: tabular-nums;">90&nbsp;€ / 150&nbsp;€</span>
        </div>
        <div class="lg-track" style="height: 7px; border-radius: 999px;">
          <div class="lg-fill" style="width: 60%; height: 100%; border-radius: 999px;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="font-weight: 700;">Svago</span>
          <span style="color: #9E3B1E; font-weight: 700; font-variant-numeric: tabular-nums;">140&nbsp;€ / 100&nbsp;€</span>
        </div>
        <div class="lg-track" style="height: 7px; border-radius: 999px;">
          <div class="lg-fill-over" style="width: 100%; height: 100%; border-radius: 999px;"></div>
        </div>
        <div style="font-size: 11px; color: #9E3B1E; font-weight: 700;">+40&nbsp;€ oltre budget</div>
      </div>
    </div>
  </div>

  <!-- Floating tab bar -->
  <div style="flex-shrink: 0; padding: 12px 16px 20px; z-index: 2;">
    <div class="lg-tabbar" style="border-radius: 30px; display: flex; padding: 6px;">
      <div class="lg-tab-active" style="flex: 1; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#B85A30" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="2"></rect><rect x="10" y="7" width="4" height="13" rx="2"></rect><rect x="16" y="3" width="4" height="17" rx="2"></rect></svg>
        <span style="color: #B85A30; font-weight: 700; font-size: 11px;">Riepilogo</span>
      </div>
      <button class="lg-btn" style="flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
        <span style="color: #7A6A5C; font-weight: 600; font-size: 11px;">Movimenti</span>
      </button>
      <button class="lg-btn" style="flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A6A5C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M8 12l3 3 5-6"></path></svg>
        <span style="color: #7A6A5C; font-weight: 600; font-size: 11px;">Cose da fare</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
