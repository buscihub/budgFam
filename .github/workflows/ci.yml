name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: it reads package.json's "packageManager" field
      # (pnpm@12.6.0) on its own, and passing both errors out.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # `next build` generates the route types (e.g. LayoutProps) that
      # `tsc --noEmit` alone relies on; it needs no env vars because the
      # only statically-prerendered pages (/login, /signup) don't read any.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # Documentation must move with the code (DESIGN_DOC "Come si tiene aggiornata
  # la documentazione"): a PR that changes src/ or a migration needs a CHANGELOG
  # entry, and §13.1 must not list a task twice. Needs the full history to find
  # where the branch left main.
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check-task-docs.mjs --strict --base "origin/${{ github.base_ref || 'main' }}"

  migrations-and-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration in supabase/migrations/ to a fresh ephemeral
      # Postgres (Docker, provided by the runner): a broken migration fails
      # the job right here, before any test runs.
      - run: supabase start

      - run: pnpm test:rls
